[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-counterfeit"
version = "0.1.0"
description = "Coherent circuit-level study of the Iwama-Nishimura-Raymond-Teruyama quantum counterfeit coin algorithm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "qiskit>=2.1,<3",
    "qiskit-aer>=0.17,<0.19",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "k1: single-counterfeit (Bernstein-Vazirani-equivalent) tests — say nothing about k > 1",
    "coherent_multi: full coherent k > 1 circuit tests under the true B-oracle",
    "reference: exact classical / reference-state tests (no circuit claims)",
    "slow: long exhaustive runs (deselect with -m 'not slow')",
    "aer: cross-checks that execute circuits on Qiskit Aer",
]
